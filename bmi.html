<!DOCTYPE html>
<html>
<body>
<h2>BMI Calculator</h2>
Height (cm): <input type="number" id="h"><br><br>
Weight (kg): <input type="number" id="w"><br><br>
<button onclick="bmi()">Calculate</button>
<p id="r"></p>
<script>
function bmi() {
    let h = document.getElementById("h").value / 100;
    let w = document.getElementById("w").value;
    let b = w / (h * h);
    let category;
    if (b < 18.5)
        category = "Underweight";
    else if (b < 25)
        category = "Normal";
    else if (b < 30)
        category = "Overweight";
    else
        category = "Obese";
    document.getElementById("r").innerHTML =
        "BMI = " + b.toFixed(2) + "<br>" + category;
}
</script>
</body>a
</html>
